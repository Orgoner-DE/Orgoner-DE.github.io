<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="application-version" content="0.1.1">
  <meta name="description" content="Vereinfachtes 3D-Modell: negative Luftionen und Ozon. Keine medizinischen Aussagen.">
  <title>Ionen — Wissenschafts-App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <style>
    :root {
      --bg: #070b14;
      --panel: #10182a;
      --line: #24344f;
      --text: #e8eef8;
      --muted: #93a4c2;
      --accent: #79c8ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 12% -10%, #1a2744 0%, transparent 60%),
        var(--bg);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      padding: 16px 20px 8px;
    }
    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 2px 0 0; font-size: 1.45rem; letter-spacing: -0.03em; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    nav span { color: var(--muted); font-size: 0.8rem; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.85fr);
      gap: 16px;
      padding: 8px 20px 12px;
    }
    .stage {
      background: #080d18;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #viewport {
      position: relative;
      flex: 1;
      min-height: 64vh;
      background: #070b14;
    }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    .badge, .boot-error {
      position: absolute;
      z-index: 3;
      margin: 0;
      pointer-events: none;
    }
    .badge {
      top: 10px;
      left: 10px;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      background: rgba(8, 12, 22, 0.78);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
    }
    .boot-error {
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 4;
      pointer-events: auto;
      background: #3a1d24;
      border: 1px solid #8a4450;
      border-radius: 10px;
      padding: 10px 12px;
      color: #ffd7de;
    }
    .labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
    .tag {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -125%);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: rgba(7, 11, 20, 0.78);
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag-neg { color: #d7e6ff; border-color: #3b82f6; }
    .tag-o3 { color: #f3f8c8; border-color: #c6d84a; }
    .tag-pos { color: #ffe8c4; border-color: #e2c08a; }
    .tag-src { color: #d7f1ff; border-color: #7ec8ea; font-weight: 600; }
    .stage-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: #0c1322;
    }
    button {
      font: inherit;
      color: var(--text);
      background: #17304a;
      border: 1px solid #3d6f95;
      border-radius: 999px;
      padding: 0.5rem 1rem;
      min-height: 44px;
      cursor: pointer;
    }
    button.topic { background: transparent; }
    button[aria-pressed="true"] { background: #1c4f78; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tempo { display: flex; align-items: center; gap: 8px; min-height: 44px; }
    .tempo label { color: var(--muted); }
    input[type="range"] { accent-color: var(--accent); width: min(40vw, 180px); }
    #tempo-val { min-width: 3.2rem; font-variant-numeric: tabular-nums; }
    #phase-label { margin-left: auto; color: var(--accent); font-size: 0.92rem; }
    aside {
      background: rgba(16, 24, 42, 0.94);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 18px;
      min-width: 0;
    }
    aside h2 { margin: 0 0 6px; font-size: 1.25rem; }
    aside h3 { margin: 16px 0 6px; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    #blurb { margin: 0; color: var(--muted); }
    #steps { margin: 0; padding-left: 1.2rem; }
    #steps li { margin: 0.4rem 0; color: var(--muted); padding: 0.28rem 0.45rem; }
    #steps li.active {
      color: var(--text);
      background: rgba(121, 200, 255, 0.1);
      border-radius: 8px;
    }
    .note { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; }
    .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .legend li { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 0.92rem; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
    footer {
      padding: 4px 20px 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 860px) {
      header { flex-direction: column; align-items: stretch; }
      main { grid-template-columns: 1fr; }
      #viewport { min-height: 58vh; }
      #phase-label { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="kicker">Wissenschafts-App</p>
      <h1>Ionen</h1>
      <p class="sub">Luft, Ladung und ein Nebenprodukt — als Lehrbild, nicht als Gerät.</p>
    </div>
    <nav aria-label="Themen">
      <span>Themen</span>
      <div id="topic-menu"></div>
    </nav>
  </header>
  <main>
    <section class="stage" aria-label="3D-Modell">
      <div id="viewport" role="img" aria-label="Animiertes, vereinfachtes 3D-Modell der Luftionisation">
        <p class="badge">vereinfachtes Modell</p>
        <p id="boot-error" class="boot-error" hidden></p>
      </div>
      <div class="stage-bar">
        <button type="button" id="play-btn" aria-pressed="true">Pause</button>
        <div class="tempo">
          <label for="tempo">Tempo</label>
          <input id="tempo" type="range" min="0.5" max="2" step="0.1" value="1" aria-valuemin="0.5" aria-valuemax="2" aria-valuenow="1">
          <span id="tempo-val">1.0×</span>
        </div>
        <span id="phase-label">Phase: Ruhe</span>
      </div>
    </section>
    <aside aria-label="Erklärung">
      <h2 id="topic-title"></h2>
      <p id="blurb"></p>
      <h3>Ablauf</h3>
      <ol id="steps"></ol>
      <h3>Einordnung</h3>
      <div id="notes"></div>
      <h3>Farben im Modell</h3>
      <ul class="legend" id="legend"></ul>
    </aside>
  </main>
  <footer>Wissenschafts-App · v0.1.1 · vereinfachtes Modell, keine medizinischen Aussagen</footer>
  <script type="module">
    import * as THREE from "three";

    window.__IONEN_BOOTED = true;
    const bootError = document.getElementById("boot-error");
    if (bootError) bootError.hidden = true;

    const PHASE_DE = {
      idle: "Ruhe",
      strike: "Entladung",
      eject: "Ladungstrennung",
      dock: "Anlagerung",
      ozone: "Ozonbildung",
      hold: "Überblick",
      reset: "Neustart"
    };
    const STEP_FOR = { idle: 0, strike: 0, eject: 1, dock: 2, ozone: 3, hold: 3, reset: -1 };

    function smooth(t) {
      const x = Math.max(0, Math.min(1, t));
      return x * x * (3 - 2 * x);
    }

    class PolyCurve extends THREE.Curve {
      constructor(points) {
        super();
        this.points = points;
        this.type = "PolyCurve";
      }
      getPoint(t, optionalTarget) {
        const target = optionalTarget || new THREE.Vector3();
        const pts = this.points;
        const n = pts.length - 1;
        const x = Math.max(0, Math.min(n, t * n));
        const i = Math.min(n - 1, Math.floor(x));
        return target.lerpVectors(pts[i], pts[i + 1], x - i);
      }
    }

    function showBoot(text) {
      if (!bootError) return;
      bootError.hidden = false;
      bootError.textContent = text;
    }

    const TOPICS = [
      // Neues Thema: Objekt hier einfügen.
      {
        id: "negative-ionen",
        title: "Negative Ionen",
        blurb: "Wie eine elektrische Entladung in Luft ein Elektron aus O₂ löst, daraus ein negatives Ion wird und als Nebenprodukt Ozon entstehen kann.",
        steps: [
          "Energiequelle (Blitz / elektrische Entladung oder Wasserfall-Sprühnebel) trifft auf Luft.",
          "Ein Elektron wird aus einem Molekül herausgelöst (Ladungstrennung).",
          "Das freie Elektron lagert sich an ein anderes O₂ an → negatives Ion (O₂⁻), im Modell blau.",
          "Als Nebenprodukt kann sich Sauerstoff zu Ozon (O₃) verbinden, im Modell gelbgrün."
        ],
        notes: [
          "Das ist ein vereinfachtes Modell, kein genauer Reaktionsmechanismus.",
          "Die Studienlage zu gesundheitlichen Effekten negativer Luftionen ist dünn und nicht belegt. Hier wird keine gesundheitliche Wirkung behauptet.",
          "Ozon ist ein reales Nebenprodukt elektrischer Ionisation und kann die Atemwege reizen.",
          "Ladungstrennung an Wasserfällen (Lenard-Effekt) gehört in denselben Themenkreis, ist aber nicht dieselbe Chemie wie eine Korona-Entladung, bei der Ozon entstehen kann."
        ],
        legend: [
          { swatch: "#e25b4a", label: "Sauerstoff O₂" },
          { swatch: "#f3d7b0", label: "blass nach der Ladungstrennung" },
          { swatch: "#bff6ff", label: "freies Elektron" },
          { swatch: "#3b82f6", label: "negatives Ion O₂⁻" },
          { swatch: "#c6d84a", label: "Ozon O₃" },
          { swatch: "#8b9bb4", label: "übrige Luft, nur Beiwerk" }
        ],
        mount(container) {
          const COL_O = new THREE.Color("#e25b4a");
          const COL_PALE = new THREE.Color("#f3d7b0");
          const COL_NEG = new THREE.Color("#3b82f6");
          const COL_O3 = new THREE.Color("#c6d84a");
          const COL_FLASH = new THREE.Color("#fff6d8");
          const COL_N = new THREE.Color("#8b9bb4");

          const VA = new THREE.Vector3(-1.45, 0.42, 0.05);
          const VB = new THREE.Vector3(-0.62, 0.52, 0.22);
          const AA = new THREE.Vector3(1.22, 0.68, -0.08);
          const AB = new THREE.Vector3(2.02, 0.58, 0.2);
          const PA = new THREE.Vector3(-0.15, -1.18, 0.05);
          const PB = new THREE.Vector3(0.64, -1.32, 0.26);
          const PA_END = new THREE.Vector3(0.02, -0.9, 0.12);
          const PB_END = new THREE.Vector3(-0.74, -1.38, 0.02);
          const VB_END = new THREE.Vector3(0.8, -1.34, 0.3);
          const away = new THREE.Vector3().subVectors(VB, VA).normalize();
          const pullOffset = away.clone().multiplyScalar(1.05);
          pullOffset.y += 0.82;
          pullOffset.z += 0.28;
          const impact = new THREE.Vector3().addVectors(VA, VB).multiplyScalar(0.5);
          const boltStart = new THREE.Vector3(impact.x, impact.y + 1.28, impact.z);

          const materials = [];
          const geometries = [];
          let alive = true;
          let playing = true;
          let speed = 1;
          let phaseListener = null;
          let rafId = 0;
          let width = 1;
          let height = 1;
          let simTime = 0;
          let viewTime = 0.6;
          let phaseIdx = 0;
          let phaseElapsed = 0;
          let lastPhase = "";

          // Phasenmaschine: idle → strike → eject → dock → ozone → hold → reset, dann Schleife.
          // Tempo skaliert die Phasenzeiten über THREE.Timer (delta * speed).
          const PHASES = [
            { name: "idle", dur: 1.15 },
            { name: "strike", dur: 0.62 },
            { name: "eject", dur: 1.2 },
            { name: "dock", dur: 1.5 },
            { name: "ozone", dur: 1.7 },
            { name: "hold", dur: 2.05 },
            { name: "reset", dur: 0.95 }
          ];

          function trackGeo(geo) {
            geometries.push(geo);
            return geo;
          }
          function makeMat(color, roughness, metalness) {
            const mat = new THREE.MeshStandardMaterial({
              color,
              roughness,
              metalness,
              emissive: color,
              emissiveIntensity: 0.04
            });
            materials.push(mat);
            return mat;
          }

          let renderer;
          try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
          } catch (err) {
            showBoot("Die 3D-Ansicht braucht WebGL. Bitte einen aktuellen Browser über einen lokalen Webserver verwenden.");
            return {
              setPlaying() {},
              setSpeed() {},
              setPhaseListener() {},
              dispose() {}
            };
          }
          if (!renderer.getContext()) {
            showBoot("WebGL ist in diesem Browser nicht verfügbar.");
            return {
              setPlaying() {},
              setSpeed() {},
              setPhaseListener() {},
              dispose() {}
            };
          }

          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.08;
          renderer.setClearColor(0x070b14, 1);
          renderer.domElement.style.width = "100%";
          renderer.domElement.style.height = "100%";
          renderer.domElement.setAttribute("role", "presentation");
          container.appendChild(renderer.domElement);

          const labelLayer = document.createElement("div");
          labelLayer.className = "labels";
          labelLayer.setAttribute("aria-hidden", "true");
          container.appendChild(labelLayer);

          function makeTag(html, cls) {
            const el = document.createElement("div");
            el.className = "tag " + cls;
            el.innerHTML = html;
            el.style.opacity = "0";
            labelLayer.appendChild(el);
            return el;
          }
          const tagNeg = makeTag("O<sub>2</sub><sup>−</sup>", "tag-neg");
          const tagO3 = makeTag("O<sub>3</sub>", "tag-o3");
          const tagPos = makeTag("O<sup>+</sup>", "tag-pos");
          const tagSrc = makeTag("Entladung", "tag-src");

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x070b14);
          scene.fog = new THREE.Fog(0x070b14, 12, 22);
          const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);

          scene.add(new THREE.AmbientLight(0x93a4c4, 0.38));
          scene.add(new THREE.HemisphereLight(0xc9dcff, 0x161222, 0.72));
          const key = new THREE.DirectionalLight(0xffffff, 1.75);
          key.position.set(5.5, 6.2, 4.2);
          scene.add(key);
          const fill = new THREE.DirectionalLight(0x8eb0ff, 0.45);
          fill.position.set(-6, 1.2, -2);
          scene.add(fill);
          const rim = new THREE.DirectionalLight(0xffc9a0, 0.32);
          rim.position.set(-1, 3, -6);
          scene.add(rim);

          const grid = new THREE.GridHelper(12, 14, 0x2c4264, 0x18263a);
          grid.position.y = -2.25;
          const gridMats = Array.isArray(grid.material) ? grid.material : [grid.material];
          gridMats.forEach((mat) => {
            mat.transparent = true;
            mat.opacity = 0.45;
          });
          scene.add(grid);

          const sphereGeo = trackGeo(new THREE.SphereGeometry(0.28, 28, 20));
          const bondGeo = trackGeo(new THREE.CylinderGeometry(0.045, 0.045, 1, 10));
          const electronGeo = trackGeo(new THREE.SphereGeometry(0.075, 18, 14));

          function atom(color) {
            const mesh = new THREE.Mesh(sphereGeo, makeMat(color, 0.3, 0.12));
            scene.add(mesh);
            return mesh;
          }
          function bond() {
            const mat = new THREE.MeshStandardMaterial({
              color: 0xb7c3d4,
              roughness: 0.42,
              metalness: 0.35,
              transparent: true,
              opacity: 1
            });
            materials.push(mat);
            const mesh = new THREE.Mesh(bondGeo, mat);
            scene.add(mesh);
            return mesh;
          }

          const vA = atom(COL_O);
          const vB = atom(COL_O);
          const aA = atom(COL_O);
          const aB = atom(COL_O);
          const pA = atom(COL_O);
          const pB = atom(COL_O);
          const bondVictim = bond();
          const bondAcceptor = bond();
          const bondPartner = bond();
          const bondOzone = bond();

          const bgPairs = [
            [-2.55, 1.45, -1.15],
            [2.55, 1.55, -0.7],
            [-2.6, -1.55, -0.55],
            [2.65, -1.15, 0.55],
            [0.15, 1.9, -1.55],
            [-1.7, 0.05, -1.75]
          ];
          const bgGroups = bgPairs.map((pos, i) => {
            const group = new THREE.Group();
            const s1 = new THREE.Mesh(sphereGeo, makeMat(COL_N, 0.45, 0.08));
            const s2 = new THREE.Mesh(sphereGeo, makeMat(COL_N, 0.45, 0.08));
            s1.scale.setScalar(0.72);
            s2.scale.setScalar(0.72);
            s1.position.x = -0.36;
            s2.position.x = 0.36;
            const bmat = new THREE.MeshStandardMaterial({ color: 0x9aa8bc, roughness: 0.5, metalness: 0.2 });
            materials.push(bmat);
            const b = new THREE.Mesh(bondGeo, bmat);
            b.rotation.z = Math.PI / 2;
            b.scale.set(0.7, 0.42, 0.7);
            group.add(s1, s2, b);
            group.position.set(pos[0], pos[1], pos[2]);
            group.rotation.set(i * 0.7, i * 1.1, i * 0.4);
            group.userData.base = group.position.clone();
            scene.add(group);
            return group;
          });

          const metal = makeMat(0xd5dde8, 0.22, 0.86);
          const ceramic = makeMat(0x314863, 0.62, 0.08);
          const rod = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.055, 0.055, 0.62, 16)), metal);
          rod.position.set(impact.x, impact.y + 1.62, impact.z);
          scene.add(rod);
          const tip = new THREE.Mesh(trackGeo(new THREE.SphereGeometry(0.09, 18, 14)), metal);
          tip.position.copy(boltStart);
          scene.add(tip);
          const insulator = new THREE.Mesh(trackGeo(new THREE.TorusGeometry(0.12, 0.028, 8, 18)), ceramic);
          insulator.position.set(impact.x, impact.y + 1.85, impact.z);
          insulator.rotation.x = Math.PI / 2;
          scene.add(insulator);

          const glowCanvas = document.createElement("canvas");
          glowCanvas.width = 64;
          glowCanvas.height = 64;
          const gctx = glowCanvas.getContext("2d");
          const grd = gctx.createRadialGradient(32, 32, 0, 32, 32, 32);
          grd.addColorStop(0, "rgba(230,255,255,1)");
          grd.addColorStop(0.35, "rgba(120,220,255,0.65)");
          grd.addColorStop(1, "rgba(0,0,0,0)");
          gctx.fillStyle = grd;
          gctx.fillRect(0, 0, 64, 64);
          const glowTex = new THREE.CanvasTexture(glowCanvas);

          const electron = new THREE.Group();
          const eMesh = new THREE.Mesh(electronGeo, new THREE.MeshBasicMaterial({ color: 0xf4ffff }));
          materials.push(eMesh.material);
          const haloMat = new THREE.SpriteMaterial({
            map: glowTex,
            color: 0xc8f6ff,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          materials.push(haloMat);
          const halo = new THREE.Sprite(haloMat);
          halo.scale.set(0.7, 0.7, 1);
          const eLight = new THREE.PointLight(0x9aefff, 0, 3.4, 2);
          electron.add(eMesh, halo, eLight);
          scene.add(electron);

          const strikeLight = new THREE.PointLight(0xd4f1ff, 0, 7, 2);
          scene.add(strikeLight);
          const shockMat = new THREE.MeshBasicMaterial({
            color: 0xd6f4ff,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
          });
          materials.push(shockMat);
          const shock = new THREE.Mesh(trackGeo(new THREE.TorusGeometry(0.32, 0.018, 8, 28)), shockMat);
          scene.add(shock);
          const flashMat = new THREE.SpriteMaterial({
            map: glowTex,
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          materials.push(flashMat);
          const flashSprite = new THREE.Sprite(flashMat);
          scene.add(flashSprite);

          const boltCoreMat = new THREE.MeshBasicMaterial({
            color: 0xf7fbff,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const boltGlowMat = new THREE.MeshBasicMaterial({
            color: 0x8fd0ff,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const boltLineMat = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
          });
          materials.push(boltCoreMat, boltGlowMat, boltLineMat);
          const boltCore = new THREE.Mesh(new THREE.BufferGeometry(), boltCoreMat);
          const boltGlow = new THREE.Mesh(new THREE.BufferGeometry(), boltGlowMat);
          const boltLine = new THREE.Line(new THREE.BufferGeometry(), boltLineMat);
          const forkCore = new THREE.Mesh(new THREE.BufferGeometry(), boltCoreMat);
          scene.add(boltCore, boltGlow, boltLine, forkCore);

          function swapGeo(mesh, geo) {
            if (mesh.geometry && mesh.geometry !== sphereGeo && mesh.geometry !== bondGeo) {
              mesh.geometry.dispose();
            }
            mesh.geometry = geo;
          }
          function jagged(a, b, segs, amp) {
            const pts = [];
            for (let i = 0; i <= segs; i += 1) {
              const t = i / segs;
              const p = new THREE.Vector3().lerpVectors(a, b, t);
              if (i !== 0 && i !== segs) {
                p.x += (Math.random() - 0.5) * amp;
                p.y += (Math.random() - 0.5) * amp * 0.35;
                p.z += (Math.random() - 0.5) * amp;
              }
              pts.push(p);
            }
            return pts;
          }
          function rebuildBolt() {
            const pts = jagged(boltStart, impact, 7, 0.42);
            const curve = new PolyCurve(pts);
            swapGeo(boltCore, new THREE.TubeGeometry(curve, 28, 0.018, 5, false));
            swapGeo(boltGlow, new THREE.TubeGeometry(curve, 28, 0.055, 6, false));
            swapGeo(boltLine, new THREE.BufferGeometry().setFromPoints(pts));
            const mid = pts[3].clone();
            const forkEnd = impact.clone().add(new THREE.Vector3(0.45, -0.05, 0.28));
            const forkPts = jagged(mid, forkEnd, 4, 0.22);
            swapGeo(forkCore, new THREE.TubeGeometry(new PolyCurve(forkPts), 12, 0.012, 4, false));
          }
          rebuildBolt();

          const dustCount = 70;
          const dustArr = new Float32Array(dustCount * 3);
          for (let i = 0; i < dustCount; i += 1) {
            dustArr[i * 3] = (Math.random() - 0.5) * 8;
            dustArr[i * 3 + 1] = (Math.random() - 0.5) * 5;
            dustArr[i * 3 + 2] = (Math.random() - 0.5) * 6;
          }
          const dustGeo = trackGeo(new THREE.BufferGeometry());
          dustGeo.setAttribute("position", new THREE.BufferAttribute(dustArr, 3));
          const dustMat = new THREE.PointsMaterial({
            color: 0xc5d4ea,
            size: 0.045,
            transparent: true,
            opacity: 0.4,
            depthWrite: false
          });
          materials.push(dustMat);
          const dust = new THREE.Points(dustGeo, dustMat);
          scene.add(dust);

          const posVA = new THREE.Vector3();
          const posVB = new THREE.Vector3();
          const posAA = new THREE.Vector3();
          const posAB = new THREE.Vector3();
          const posPA = new THREE.Vector3();
          const posPB = new THREE.Vector3();
          const bobV = new THREE.Vector3();
          const bobA = new THREE.Vector3();
          const bobP = new THREE.Vector3();
          const bobMix = new THREE.Vector3();
          const ePos = new THREE.Vector3();
          const dockStart = new THREE.Vector3();
          const dockEnd = new THREE.Vector3();
          const cTmp = new THREE.Color();
          const cTmp2 = new THREE.Color();
          const yAxis = new THREE.Vector3(0, 1, 0);
          const dir = new THREE.Vector3();
          const labelPos = new THREE.Vector3();

          function writeBob(target, seed, amp) {
            target.set(
              Math.sin(simTime * 0.9 + seed) * amp,
              Math.cos(simTime * 0.75 + seed * 1.3) * amp,
              Math.sin(simTime * 0.5 + seed) * amp * 0.55
            );
          }
          function placeBond(mesh, a, b, opacity) {
            dir.subVectors(b, a);
            const len = dir.length();
            if (len < 0.08 || opacity <= 0.02) {
              mesh.visible = false;
              return;
            }
            mesh.visible = true;
            mesh.position.copy(a).add(b).multiplyScalar(0.5);
            dir.multiplyScalar(1 / len);
            if (Math.abs(dir.dot(yAxis)) > 0.999) dir.x += 0.001;
            mesh.quaternion.setFromUnitVectors(yAxis, dir);
            mesh.scale.set(1, len, 1);
            mesh.material.opacity = opacity;
          }
          function paint(mesh, color, emissiveIntensity) {
            mesh.material.color.copy(color);
            mesh.material.emissive.copy(color);
            mesh.material.emissiveIntensity = emissiveIntensity;
          }
          function mixChannels(phase, p) {
            const s = smooth(p);
            if (phase === "strike") {
              const pulse = Math.exp(-((p - 0.22) ** 2) / 0.01) * 0.9 + Math.exp(-((p - 0.58) ** 2) / 0.018);
              const bolt = Math.max(0, Math.min(1, pulse));
              return { pale: 0, dock: 0, ozone: 0, mode: "hidden", eTravel: 0, eAlpha: 0, bolt, flash: bolt, labN: 0, labO: 0, labP: 0 };
            }
            if (phase === "eject") {
              return {
                pale: s, dock: 0, ozone: 0, mode: "eject", eTravel: s, eAlpha: 1,
                bolt: Math.max(0, 1 - p * 5) * 0.35,
                flash: Math.max(0, 1 - p * 3),
                labN: 0, labO: 0, labP: s
              };
            }
            if (phase === "dock") {
              const arrive = smooth(Math.min(1, p / 0.82));
              const absorb = smooth(Math.max(0, (p - 0.78) / 0.22));
              return {
                pale: 1, dock: smooth(Math.min(1, p / 0.72)), ozone: 0, mode: "dock",
                eTravel: arrive, eAlpha: 1 - absorb, bolt: 0, flash: 0,
                labN: smooth(Math.max(0, (p - 0.48) / 0.52)), labO: 0, labP: 1
              };
            }
            if (phase === "ozone") {
              return { pale: 1, dock: 1, ozone: s, mode: "hidden", eTravel: 0, eAlpha: 0, bolt: 0, flash: 0, labN: 1, labO: s, labP: 1 };
            }
            if (phase === "hold") {
              return { pale: 1, dock: 1, ozone: 1, mode: "hidden", eTravel: 0, eAlpha: 0, bolt: 0, flash: 0, labN: 1, labO: 1, labP: 1 };
            }
            if (phase === "reset") {
              return {
                pale: 1 - s, dock: 1 - s, ozone: 1 - s, mode: "hidden", eTravel: 0, eAlpha: 0,
                bolt: 0, flash: 0, labN: 1 - s, labO: 1 - s, labP: 1 - s
              };
            }
            return { pale: 0, dock: 0, ozone: 0, mode: "hidden", eTravel: 0, eAlpha: 0, bolt: 0, flash: 0, labN: 0, labO: 0, labP: 0 };
          }
          function placeLabel(el, world, opacity) {
            if (opacity <= 0.03) {
              el.style.opacity = "0";
              return;
            }
            labelPos.copy(world).project(camera);
            if (labelPos.z > 1) {
              el.style.opacity = "0";
              return;
            }
            const x = (labelPos.x * 0.5 + 0.5) * width;
            const y = (-labelPos.y * 0.5 + 0.5) * height;
            el.style.opacity = String(Math.max(0, Math.min(1, opacity)));
            el.style.left = x + "px";
            el.style.top = y + "px";
          }

          function resize() {
            width = Math.max(1, container.clientWidth);
            height = Math.max(1, container.clientHeight);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
          }
          const resizeObs = new ResizeObserver(resize);
          resizeObs.observe(container);
          resize();

          const timer = new THREE.Timer();
          timer.connect(document);
          timer.update();

          function frame(ts) {
            if (!alive) return;
            timer.update(ts);
            const dt = Math.min(0.05, timer.getDelta());
            if (playing) {
              simTime += dt * speed;
              viewTime += dt;
              phaseElapsed += dt * speed;
              let guard = 0;
              while (phaseElapsed >= PHASES[phaseIdx].dur && guard < 8) {
                phaseElapsed -= PHASES[phaseIdx].dur;
                phaseIdx = (phaseIdx + 1) % PHASES.length;
                if (PHASES[phaseIdx].name === "strike") rebuildBolt();
                guard += 1;
              }
            }

            const phase = PHASES[phaseIdx];
            if (phase.name !== lastPhase) {
              lastPhase = phase.name;
              if (phaseListener) phaseListener(phase.name);
            }
            const p = phase.dur > 0 ? phaseElapsed / phase.dur : 0;
            const ch = mixChannels(phase.name, p);

            const ang = 0.62 + viewTime * 0.18;
            camera.position.set(Math.sin(ang) * 7.35, 2.05 + Math.sin(viewTime * 0.35) * 0.18, Math.cos(ang) * 7.35);
            camera.lookAt(0.05, 0.05, 0);

            const amp = 0.055 * (1 - ch.flash * 0.75);
            writeBob(bobV, 1.2, amp);
            writeBob(bobA, 2.5, 0.05);
            writeBob(bobP, 3.7, 0.048);

            posVA.copy(VA).add(bobV);
            posVB.lerpVectors(VB, VB_END, ch.ozone);
            bobMix.copy(bobV).lerp(bobP, ch.ozone);
            posVB.add(bobMix);
            posAA.copy(AA).add(bobA);
            posAB.copy(AB).add(bobA);
            posPA.lerpVectors(PA, PA_END, ch.ozone).add(bobP);
            posPB.lerpVectors(PB, PB_END, ch.ozone).add(bobP);

            vA.position.copy(posVA);
            vB.position.copy(posVB);
            aA.position.copy(posAA);
            aB.position.copy(posAB);
            pA.position.copy(posPA);
            pB.position.copy(posPB);
            const punch = 1 + ch.flash * 0.16;
            vA.scale.setScalar(punch);
            vB.scale.setScalar(1 + ch.flash * 0.1);

            cTmp.copy(COL_O).lerp(COL_PALE, ch.pale);
            if (ch.flash > 0) cTmp.lerp(COL_FLASH, ch.flash * 0.72);
            paint(vA, cTmp, 0.05 + ch.pale * 0.16 + ch.flash * 0.45);

            cTmp2.copy(COL_O).lerp(COL_PALE, ch.pale);
            cTmp2.lerp(COL_O3, ch.ozone);
            if (ch.flash > 0) cTmp2.lerp(COL_FLASH, ch.flash * 0.72);
            paint(vB, cTmp2, 0.05 + ch.pale * 0.12 + ch.ozone * 0.2 + ch.flash * 0.4);

            cTmp.copy(COL_O).lerp(COL_NEG, ch.dock);
            paint(aA, cTmp, 0.05 + ch.dock * 0.42);
            paint(aB, cTmp, 0.05 + ch.dock * 0.42);

            cTmp.copy(COL_O).lerp(COL_O3, ch.ozone);
            paint(pA, cTmp, 0.05 + ch.ozone * 0.22);
            paint(pB, cTmp, 0.05 + ch.ozone * 0.22);

            placeBond(bondVictim, posVA, posVB, 1 - ch.ozone);
            placeBond(bondAcceptor, posAA, posAB, 1);
            placeBond(bondPartner, posPA, posPB, 1);
            placeBond(bondOzone, posVB, posPA, ch.ozone);

            dockStart.copy(posVA).lerp(posVB, 0.5);
            if (ch.mode === "eject") {
              dockEnd.copy(posVB).add(pullOffset);
              ePos.lerpVectors(posVB, dockEnd, ch.eTravel);
            } else if (ch.mode === "dock") {
              dockStart.copy(VB).add(pullOffset).add(bobV);
              dockEnd.copy(posAA).add(posAB).multiplyScalar(0.5);
              ePos.lerpVectors(dockStart, dockEnd, ch.eTravel);
              const arc = Math.sin(Math.PI * ch.eTravel);
              ePos.y += arc * 0.66;
              ePos.z += arc * 0.22;
            }
            const eOn = ch.eAlpha > 0.03 && (ch.mode === "eject" || ch.mode === "dock");
            electron.visible = eOn;
            if (eOn) {
              electron.position.copy(ePos);
              const pulse = 0.85 + Math.sin(simTime * 9) * 0.12;
              eMesh.scale.setScalar(ch.eAlpha * pulse);
              halo.scale.setScalar(0.85 * ch.eAlpha * pulse);
              haloMat.opacity = 0.9 * ch.eAlpha;
              eLight.intensity = 7 * ch.eAlpha;
            } else {
              eLight.intensity = 0;
            }

            const showBolt = ch.bolt > 0.04;
            boltCore.visible = showBolt;
            boltGlow.visible = showBolt;
            boltLine.visible = showBolt;
            forkCore.visible = showBolt;
            boltCoreMat.opacity = ch.bolt;
            boltGlowMat.opacity = 0.4 * ch.bolt;
            boltLineMat.opacity = ch.bolt;
            strikeLight.intensity = showBolt ? 16 * ch.bolt : 0;
            strikeLight.position.copy(posVA).lerp(posVB, 0.5);
            shock.position.copy(strikeLight.position);
            shock.lookAt(camera.position);
            shock.scale.setScalar(0.55 + (phase.name === "strike" ? p : 0) * 2.1);
            shockMat.opacity = ch.bolt * 0.9;
            flashSprite.position.copy(strikeLight.position);
            flashSprite.material.opacity = ch.bolt;
            flashSprite.scale.setScalar(0.45 + ch.bolt * 1.1);

            bgGroups.forEach((group, i) => {
              const base = group.userData.base;
              group.position.x = base.x + Math.sin(simTime * 0.45 + i) * 0.05;
              group.position.y = base.y + Math.cos(simTime * 0.52 + i * 1.2) * 0.06;
              if (playing) group.rotation.y += dt * 0.12;
            });
            if (playing) dust.rotation.y += dt * 0.03;

            dockEnd.copy(posAA).add(posAB).multiplyScalar(0.5);
            placeLabel(tagNeg, dockEnd, ch.labN);
            dockStart.copy(posPA).add(posPB).add(posVB).multiplyScalar(1 / 3);
            dockStart.y += 0.08;
            placeLabel(tagO3, dockStart, ch.labO);
            placeLabel(tagPos, posVA, ch.labP);
            placeLabel(tagSrc, boltStart, 0.8);

            renderer.render(scene, camera);
            rafId = requestAnimationFrame(frame);
          }
          rafId = requestAnimationFrame(frame);

          return {
            setPlaying(value) {
              if (!alive) return;
              playing = Boolean(value);
            },
            setSpeed(value) {
              if (!alive) return;
              const n = Number(value);
              speed = Number.isFinite(n) ? Math.min(2, Math.max(0.5, n)) : 1;
            },
            setPhaseListener(fn) {
              phaseListener = typeof fn === "function" ? fn : null;
              if (phaseListener && lastPhase) phaseListener(lastPhase);
            },
            dispose() {
              if (!alive) return;
              alive = false;
              cancelAnimationFrame(rafId);
              resizeObs.disconnect();
              boltCore.geometry.dispose();
              boltGlow.geometry.dispose();
              boltLine.geometry.dispose();
              forkCore.geometry.dispose();
              geometries.forEach((geo) => geo.dispose());
              materials.forEach((mat) => mat.dispose());
              gridMats.forEach((mat) => mat.dispose());
              glowTex.dispose();
              renderer.dispose();
              renderer.forceContextLoss();
              if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
              if (labelLayer.parentNode) labelLayer.parentNode.removeChild(labelLayer);
            }
          };
        }
      }
    ];

    const menu = document.getElementById("topic-menu");
    const titleEl = document.getElementById("topic-title");
    const blurbEl = document.getElementById("blurb");
    const stepsEl = document.getElementById("steps");
    const notesEl = document.getElementById("notes");
    const legendEl = document.getElementById("legend");
    const playBtn = document.getElementById("play-btn");
    const tempo = document.getElementById("tempo");
    const tempoVal = document.getElementById("tempo-val");
    const phaseEl = document.getElementById("phase-label");
    const viewport = document.getElementById("viewport");

    let playing = true;
    let currentApi = null;
    let currentTopic = null;

    function syncPlay() {
      playBtn.textContent = playing ? "Pause" : "Weiter";
      playBtn.setAttribute("aria-pressed", playing ? "true" : "false");
    }

    function renderExplain(topic) {
      titleEl.textContent = topic.title;
      blurbEl.textContent = topic.blurb;
      stepsEl.replaceChildren();
      topic.steps.forEach((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        stepsEl.appendChild(li);
      });
      notesEl.replaceChildren();
      (topic.notes || []).forEach((text) => {
        const p = document.createElement("p");
        p.className = "note";
        p.textContent = text;
        notesEl.appendChild(p);
      });
      legendEl.replaceChildren();
      (topic.legend || []).forEach((item) => {
        const li = document.createElement("li");
        const sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = item.swatch;
        li.append(sw, document.createTextNode(item.label));
        legendEl.appendChild(li);
      });
    }

    function onPhase(name) {
      phaseEl.textContent = "Phase: " + (PHASE_DE[name] || name);
      const step = Object.prototype.hasOwnProperty.call(STEP_FOR, name) ? STEP_FOR[name] : -1;
      stepsEl.querySelectorAll("li").forEach((li, idx) => {
        const on = idx === step;
        li.classList.toggle("active", on);
        if (on) li.setAttribute("aria-current", "step");
        else li.removeAttribute("aria-current");
      });
    }

    function activate(topic, button) {
      if (currentTopic === topic) return;
      if (currentApi) currentApi.dispose();
      menu.querySelectorAll("button").forEach((el) => {
        el.setAttribute("aria-pressed", el === button ? "true" : "false");
      });
      renderExplain(topic);
      currentApi = topic.mount(viewport);
      currentApi.setPhaseListener(onPhase);
      currentApi.setSpeed(Number(tempo.value));
      currentApi.setPlaying(playing);
      currentTopic = topic;
    }

    TOPICS.forEach((topic, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "topic";
      button.textContent = topic.title;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => activate(topic, button));
      menu.appendChild(button);
      if (index === 0) activate(topic, button);
    });

    playBtn.addEventListener("click", () => {
      playing = !playing;
      syncPlay();
      if (currentApi) currentApi.setPlaying(playing);
    });
    tempo.addEventListener("input", () => {
      const value = Number(tempo.value);
      tempoVal.textContent = value.toFixed(1) + "×";
      tempo.setAttribute("aria-valuenow", String(value));
      if (currentApi) currentApi.setSpeed(value);
    });

    if ("serviceWorker" in navigator && (location.protocol === "http:" || location.protocol === "https:")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
  <script>
    if (location.protocol === "file:") {
      const el = document.getElementById("boot-error");
      el.hidden = false;
      el.textContent = "Bitte die App über einen lokalen Webserver öffnen (nicht als file://). Im Ordner: python3 -m http.server 8000, dann http://localhost:8000";
    } else {
      setTimeout(() => {
        if (!window.__IONEN_BOOTED) {
          const el = document.getElementById("boot-error");
          el.hidden = false;
          el.textContent = "Three.js konnte nicht geladen werden. Die Seite braucht einen Webserver und beim ersten Mal erreichbares CDN (unpkg).";
        }
      }, 8000);
    }
  </script>
</body>
