name: Build EX-TRIBE STUDIO 6.3 (Android + iOS)
on:
  push:
    branches: [main, extribe63-heavy-chain-20261108]
    paths: ["extribe6/**", ".github/workflows/extribe-v6-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy shared Web assets into Android app
        run: |
          mkdir -p extribe6/native/Android/app/src/main/assets
          cp extribe6/{index.html,app.css,app.js,fx53.js,hud55.js,hud55.css,packs.js,packs_extra.js,packs_53.js,presets55.js,song54.js,midi.js,studio60.js,studio60.css,piano61.js,piano61.css,rack62.js,rack62.css,heavy63.js,heavy63.css,sw.js,manifest.webmanifest,icon.svg,latest.json} extribe6/native/Android/app/src/main/assets/
      - name: Build Android Debug APK
        run: gradle -p extribe6/native/Android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EXTRIBE-STUDIO-6.3-Android-APK
          path: extribe6/native/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Copy shared Web assets into iOS app
        run: |
          mkdir -p extribe6/native/iOS/EXTRIBE/www
          cp extribe6/{index.html,app.css,app.js,fx53.js,hud55.js,hud55.css,packs.js,packs_extra.js,packs_53.js,presets55.js,song54.js,midi.js,studio60.js,studio60.css,piano61.js,piano61.css,rack62.js,rack62.css,heavy63.js,heavy63.css,sw.js,manifest.webmanifest,icon.svg,latest.json} extribe6/native/iOS/EXTRIBE/www/
      - name: Build iOS Simulator
        run: >
          xcodebuild -project extribe6/native/iOS/EXTRIBE.xcodeproj
          -scheme EXTRIBE -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/EXTRIBE63"
          CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator
        run: |
          cd "$RUNNER_TEMP/EXTRIBE63/Build/Products/Debug-iphonesimulator"
          zip -qr "$GITHUB_WORKSPACE/EXTRIBE-STUDIO-6.3-iOS-Simulator.zip" EXTRIBE.app
      - uses: actions/upload-artifact@v4
        with:
          name: EXTRIBE-STUDIO-6.3-iOS-Simulator
          path: EXTRIBE-STUDIO-6.3-iOS-Simulator.zip
          if-no-files-found: error

  publish-apk:
    if: github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EXTRIBE-STUDIO-6.3-Android-APK
          path: release
      - name: Publish versioned APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release/app-debug.apk
          mv release/app-debug.apk release/EXTRIBE-STUDIO-6.3.apk
          gh release view extribe-studio-6.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create extribe-studio-6.3 --repo "${GITHUB_REPOSITORY}" --title "EX-TRIBE Studio 6.3" --notes "Heavy Chain: mobile HUD, APC mini MK2 MIDI Learn, audio limiter. Debug APK, device testing pending."
          gh release upload extribe-studio-6.3 release/EXTRIBE-STUDIO-6.3.apk --repo "${GITHUB_REPOSITORY}" --clobber
