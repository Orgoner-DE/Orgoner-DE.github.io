name: Build DJ DECK PRO 4 (Android APK)
on:
  push:
    branches: [main, ccr-2a31763f-1oek8m]
    paths: ["dj4/index.html", "dj4/android/**", ".github/workflows/dj4-build.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dj4-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy web app into APK assets
        run: |
          mkdir -p dj4/android/app/src/main/assets
          cp dj4/index.html dj4/android/app/src/main/assets/index.html
      - name: Build release APK
        run: gradle -p dj4/android --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: DJ-DECK-PRO-4-Android-APK
          path: dj4/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish APK next to index.html
        run: |
          cp dj4/android/app/build/outputs/apk/release/app-release.apk dj4/DJ-DECK-PRO-4.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dj4/DJ-DECK-PRO-4.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish DJ DECK PRO 4 Android APK [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
