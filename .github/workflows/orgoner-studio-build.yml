name: Orgoner Studio Android iOS Build
on:
  push:
    branches: [orgoner-studio-build-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p orgoner-studio/Android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Orgoner-Studio-PRO-Android-APK
          path: orgoner-studio/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator App
        run: >
          xcodebuild -project orgoner-studio/iOS/OrgonerStudioIOS.xcodeproj
          -scheme OrgonerStudioIOS -configuration Debug
          -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/OrgonerStudio"
          CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          cd "$RUNNER_TEMP/OrgonerStudio/Build/Products/Debug-iphonesimulator"
          zip -qr "$GITHUB_WORKSPACE/Orgoner-Studio-iOS-Simulator.zip" OrgonerStudioIOS.app
      - uses: actions/upload-artifact@v4
        with:
          name: Orgoner-Studio-PRO-iOS-Simulator
          path: Orgoner-Studio-iOS-Simulator.zip
          if-no-files-found: error
